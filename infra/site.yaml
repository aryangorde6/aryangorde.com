AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aryangorde.com — static portfolio on a private S3 bucket behind CloudFront.
  Deploy in ap-south-1 (the bucket lives in Mumbai; CloudFront itself is global).
  The certificate must be an ACM certificate in us-east-1 (a CloudFront rule).
  Leave CertificateArn empty to run on the *.cloudfront.net address only.

Parameters:
  DomainName:
    Type: String
    Default: aryangorde.com
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate (us-east-1) covering DomainName (and www.DomainName if IncludeWww; a *.DomainName wildcard counts).
  IncludeWww:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Attach www.DomainName too. "false" while the certificate covers only the bare domain
      (e.g. www still points elsewhere and its CAA blocks Amazon).

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  WithWww: !And [!Condition HasCert, !Equals [!Ref IncludeWww, "true"]]

Resources:
  # Private bucket: nothing is public; only this distribution can read it (OAC below).
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Old versions are kept 30 days, so a bad deploy can be rolled back.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: aryangorde-site

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Runs on every request:
  #   1. aryangorde.com → https://www.aryangorde.com (301), keeping the path and query.
  #      www is the main address (09 Nov 2026; until then it was the other way round).
  #      Only when www is attached (IncludeWww), or the redirect would lead nowhere.
  #   2. Each feature page is /<slug>/index.html: "/slug/" is served from it, and
  #      "/slug" (no file extension) gets a 301 to "/slug/" so relative links hold.
  #      From the bare domain both happen in one hop.
  # The host redirect carries max-age=86400: browsers keep a 301 with no expiry forever,
  # so if the main address ever flips again, a remembered redirect can't loop for long.
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the bare domain to www; serve /slug/ from /slug/index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var BARE = '${DomainName}';
          var WWW = '${WwwHost}';
          function query(request) {
            var qs = [];
            for (var key in request.querystring) {
              var param = request.querystring[key];
              var values = param.multiValue ? param.multiValue : [param];
              for (var i = 0; i < values.length; i++) {
                qs.push(values[i].value === '' ? key : key + '=' + values[i].value);
              }
            }
            return qs.length ? '?' + qs.join('&') : '';
          }
          function moved(location, maxAge) {
            var headers = { location: { value: location } };
            if (maxAge) {
              headers['cache-control'] = { value: 'max-age=' + maxAge };
            }
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: headers };
          }
          function handler(event) {
            var request = event.request;
            var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';
            var uri = request.uri;
            var name = uri.substring(uri.lastIndexOf('/') + 1);
            var path = (name !== '' && name.indexOf('.') === -1) ? uri + '/' : uri;
            if (WWW && host === BARE) {
              return moved('https://' + WWW + path + query(request), 86400);
            }
            if (path !== uri) {
              return moved(path + query(request));
            }
            if (uri.charAt(uri.length - 1) === '/') {
              request.uri = uri + 'index.html';
            }
            return request;
          }
        - WwwHost: !If [WithWww, !Sub "www.${DomainName}", ""]

  # HSTS deliberately without includeSubDomains: teesrakaan/debtclear/mnemos.aryangorde.com
  # are separate servers and must not be forced onto HTTPS by this site.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} portfolio"
        Aliases: !If
          - WithWww
          - [!Ref DomainName, !Sub "www.${DomainName}"]
          - !If [HasCert, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCert
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honours the Cache-Control set by deploy.sh; gzip + brotli.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirect.FunctionARN
        # The bucket answers 403 for a missing key (CloudFront may not list it).
        # Unknown paths get the "Not in this issue" page with a real 404 status.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: project
          Value: aryangorde-site

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Description: Point the DNS records at this name.
    Value: !GetAtt Distribution.DomainName
